<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 620" role="img" aria-labelledby="t d" font-family="SF Mono, Menlo, Consolas, monospace" font-size="20">
  <title id="t">website-bar demo terminal</title>
  <desc id="d">A terminal session: the failing demo page draws five FAIL lines across headline economy, motion durations and slop patterns, then the clean demo page clears all four check families.</desc>
  <style>
    .p { fill: #7ee2a8; }
    .cmd { fill: #e8eef5; }
    .dim { fill: #9fb0c0; }
    .bad { fill: #ff9494; }
    .good { fill: #7ee2a8; }
  </style>
  <rect width="660" height="620" rx="14" fill="#0b0f14"/>
  <rect width="660" height="40" rx="14" fill="#11161d"/>
  <rect y="26" width="660" height="14" fill="#11161d"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="20" r="6" fill="#febc2e"/>
  <circle cx="70" cy="20" r="6" fill="#28c840"/>
  <text x="92" y="26" class="dim" font-size="14">taste, enforced</text>
  <text x="24" y="80"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 website_bar.py demo/failing-page.html --bar \</tspan></text>
  <text x="24" y="112" class="cmd">    config/example-bar.json</text>
  <text x="24" y="144" class="bad">headline economy: FAIL</text>
  <text x="24" y="176" class="dim">  - h1 runs 9 words, ceiling is 7</text>
  <text x="24" y="208" class="dim">  - h2 opens with the banned phrase &quot;Unlock&quot;</text>
  <text x="24" y="240" class="bad">motion durations: FAIL</text>
  <text x="24" y="272" class="dim">  - 1500ms is past the absolute ceiling of 700ms</text>
  <text x="24" y="304" class="bad">slop patterns: FAIL</text>
  <text x="24" y="336" class="dim">  - 5 lines open with an emoji, allowance is 0</text>
  <text x="24" y="368" class="bad">FAIL: 5 failure(s) across 4 check families (0 disabled in t…</text>
  <text x="24" y="400"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 website_bar.py demo/passing-page.html --bar \</tspan></text>
  <text x="24" y="432" class="cmd">    config/example-bar.json</text>
  <text x="24" y="464" class="good">headline economy: PASS</text>
  <text x="24" y="496" class="good">motion durations: PASS</text>
  <text x="24" y="528" class="good">slop patterns: PASS</text>
  <text x="24" y="560" class="good">craft basics: PASS</text>
  <text x="24" y="592" class="good">PASS: 0 failure(s) across 4 check families (0 disabled in t…</text>
