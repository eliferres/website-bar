name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Grade the demo pages against the example bar
        run: |
          python website_bar.py demo/passing-page.html --bar config/example-bar.json
          python website_bar.py demo/failing-page.html --bar config/example-bar.json && code=0 || code=$?
          [ "$code" = 1 ] || { echo "failing page exited $code, expected 1"; exit 1; }
      - name: Install the package and run the installed command
        run: |
          python -m pip install .
          website-bar --version
          website-bar demo/passing-page.html --bar config/example-bar.json
